<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Редактор точок, кіл відстаней, секторів та орієнтирів на карті." />
  <title>Картографічний редактор зон — відстані та сектори</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <aside class="side" id="settingsPanel" aria-label="Налаштування карти">
    <header class="sidebar-header">
      <h1>Точки на карті</h1>
      <div class="title-row">
        <span class="card-title-text" id="cardTitleText">Картка відстаней та обмежених зон</span>
        <label class="sr-only" for="cardTitle">Назва картки</label>
        <input id="cardTitle" type="text" value="Картка відстаней та обмежених зон" maxlength="90" hidden />
        <button class="icon-btn" id="editTitle" type="button" aria-label="Редагувати назву картки" title="Редагувати назву картки">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m16 3 5 5L8 21H3v-5Z"/><path d="m14 5 5 5"/></svg>
        </button>
      </div>
    </header>

    <div class="scroll">
      <div class="list-heading">
        <div class="heading-label"><span>Список точок</span><span class="chip" id="pointCount">0</span></div>
        <div class="heading-actions">
          <button class="icon-btn" id="toggleAllVisibility" type="button" aria-label="Змінити видимість усіх точок" title="Змінити видимість усіх точок">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash class="hidden" d="m3 3 18 18"/></svg>
          </button>
          <button class="icon-btn settings-gear" id="globalSettings" type="button" data-action="global-settings" aria-label="Загальні налаштування" title="Загальні налаштування">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          </button>
        </div>
      </div>
      <p id="emptyPoints" class="empty-state">Натисніть на карту, щоб додати першу точку.</p>
      <ol id="pointList" class="point-list" aria-label="Точки та їхні налаштування"></ol>
    </div>

    <footer class="sidebar-footer">
      <button class="btn" id="importJSON" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 19h16"/></svg>
        Відкрити проєкт
      </button>
      <input type="file" id="filePicker" accept="application/json,.json" hidden />
    </footer>
  </aside>

  <button type="button" class="edge-tab settings-toggle" id="toggleSettings" aria-label="Приховати меню" title="Приховати меню" aria-expanded="true" aria-controls="settingsPanel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
  </button>
  <button type="button" class="edge-tab save-toggle" id="saveToggle" aria-label="Відкрити меню збереження" title="Зберегти або експортувати" aria-expanded="false" aria-controls="saveMenu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 3h12l2 2v16H5Z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>
  </button>
  <div class="save-menu" id="saveMenu" hidden>
    <button class="btn" id="exportJSON" type="button">Зберегти проєкт</button>
    <button class="btn" id="exportPoints" type="button">Список точок CSV</button>
    <button class="btn" id="exportGeoJSON" type="button">GeoJSON</button>
    <button class="btn" id="print" type="button">Друк / PDF</button>
  </div>

  <main class="map-wrap">
    <div id="map" role="application" aria-label="Інтерактивна географічна карта"></div>
    <div class="map-header"><div id="modeBadge" class="badge-mode hidden">Позначте початок сектора</div></div>
  </main>
</div>

<template id="pointTemplate">
  <li class="point-card" tabindex="0">
    <div class="point-head">
      <span class="point-name-text"></span>
      <label class="sr-only" for="name">Назва точки</label>
      <input class="point-name" id="name" data-field="name" type="text" maxlength="80" hidden />
      <button class="icon-btn" data-action="edit-name" type="button" aria-label="Редагувати назву точки" title="Редагувати назву точки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m16 3 5 5L8 21H3v-5Z"/><path d="m14 5 5 5"/></svg>
      </button>
      <button class="icon-btn" data-action="toggle-visibility" type="button" aria-pressed="true" aria-label="Приховати точку на карті" title="Приховати точку на карті">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path data-eye-slash class="hidden" d="m3 3 18 18"/></svg>
      </button>
      <button class="icon-btn" data-action="center-point" type="button" aria-label="Центрувати на точці" title="Центрувати на точці">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 1v5m0 12v5M1 12h5m12 0h5"/></svg>
      </button>
      <button class="icon-btn point-toggle" data-action="toggle-point" type="button" aria-expanded="true" aria-label="Згорнути налаштування точки" title="Згорнути налаштування точки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>

    <div class="point-body">
      <section class="section coordinate-section">
        <div class="section-heading">
          <strong>Координати</strong>
          <button class="coordinate-text" data-action="edit-coordinates" type="button"></button>
        </div>
        <form data-action="coordinates" hidden>
          <div class="cols2">
            <div class="field"><label for="lat">Широта</label><input type="number" id="lat" data-field="lat" min="-85" max="85" step="any" required /></div>
            <div class="field"><label for="lng">Довгота</label><input type="number" id="lng" data-field="lng" min="-180" max="180" step="any" required /></div>
          </div>
          <button type="submit" class="btn btn-primary">Застосувати</button>
        </form>
      </section>

      <section class="section">
        <div class="section-heading">
          <strong>Кола відстаней</strong>
          <button class="icon-btn settings-gear" data-action="ring-settings" type="button" aria-label="Налаштування кіл" title="Налаштування кіл">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
          </button>
        </div>
        <div class="cols2">
          <div class="field"><label for="maxDistance">Макс. відстань, м</label><input id="maxDistance" data-setting="maxDistance" type="number" min="1" max="1000000" step="1" /></div>
          <div class="field"><label for="step">Крок, м</label><input id="step" data-setting="step" type="number" min="1" max="100000" step="1" /></div>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <strong>Заштриховані сектори</strong>
          <div class="section-actions">
            <button class="icon-btn settings-gear" data-action="sector-settings" type="button" aria-label="Типові налаштування секторів" title="Типові налаштування секторів">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
            </button>
            <button class="btn btn-compact" data-action="add-zone" type="button">+ Сектор</button>
            <button class="icon-btn" data-action="draw-zone" type="button" aria-label="Позначити сектор двома кліками" title="Позначити сектор двома кліками">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6Z M13 6l5 5"/></svg>
            </button>
          </div>
        </div>
        <p class="no-zones">Секторів поки немає.</p>
        <ol class="zone-list" aria-label="Сектори точки"></ol>
      </section>

      <section class="section">
        <div class="section-heading">
          <strong>Орієнтири</strong>
          <div class="section-actions">
            <button class="icon-btn settings-gear" data-action="landmark-settings" type="button" aria-label="Налаштування орієнтирів" title="Налаштування орієнтирів">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
            </button>
            <button class="btn btn-compact" data-action="add-landmark" type="button">+ Орієнтир</button>
          </div>
        </div>
        <ol class="landmark-list" aria-label="Орієнтири точки"></ol>
      </section>

      <button class="btn btn-danger delete-point" data-action="delete-point" type="button">Видалити точку</button>
    </div>
  </li>
</template>

<template id="zoneTemplate">
  <li class="zone-card">
    <label class="sr-only" for="start">Початковий кут у градусах</label>
    <div class="input-unit"><input id="start" data-zone-field="start" type="number" min="0" max="359.99" step="any" aria-label="Початковий кут у градусах" /><span class="unit" aria-hidden="true">°</span></div>
    <label class="sr-only" for="end">Кінцевий кут у градусах</label>
    <div class="input-unit"><input id="end" data-zone-field="end" type="number" min="0" max="360" step="any" aria-label="Кінцевий кут у градусах" /><span class="unit" aria-hidden="true">°</span></div>
    <button class="icon-btn settings-gear" data-action="zone-settings" type="button" aria-label="Налаштування сектора" title="Налаштування сектора">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
    </button>
    <button class="icon-btn danger-icon" data-action="delete-zone" type="button" aria-label="Видалити сектор" title="Видалити сектор">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 10v8m4-8v8"/></svg>
    </button>
  </li>
</template>

<template id="landmarkTemplate">
  <li class="landmark-item">
    <span class="landmark-name"></span>
    <button class="icon-btn" data-action="edit-landmark" type="button" aria-label="Редагувати орієнтир" title="Редагувати орієнтир">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m16 3 5 5L8 21H3v-5Z"/><path d="m14 5 5 5"/></svg>
    </button>
    <button class="icon-btn danger-icon" data-action="delete-landmark" type="button" aria-label="Видалити орієнтир" title="Видалити орієнтир">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 10v8m4-8v8"/></svg>
    </button>
  </li>
</template>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <form id="settingsForm" method="dialog">
    <header class="dialog-header">
      <div>
        <h2 id="settingsTitle">Налаштування</h2>
        <p id="settingsScope"></p>
      </div>
      <button class="icon-btn" id="closeSettings" type="button" aria-label="Закрити налаштування" title="Закрити">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div id="settingsFields"></div>
    <footer class="dialog-actions">
      <button class="btn" id="resetSettings" type="button">Скинути</button>
      <button class="btn btn-primary" type="submit">Зберегти</button>
    </footer>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
