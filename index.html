<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Редактор точок, кіл відстаней, секторів та орієнтирів на карті." />
  <title>Картографічний редактор зон — відстані та сектори</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
  <style id="app-styles">
:root {
  --font-ui: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  --ink: #1d2b42;
  --ink-strong: #14233a;
  --ink-muted: #52637a;
  --ink-soft: #68788d;
  --surface-canvas: #edf1f6;
  --surface-panel: #ffffff;
  --surface-subtle: #f6f9fd;
  --surface-control: #f4f7fb;
  --surface-hover: #e9effa;
  --surface-selected: #e4eeff;
  --surface-accent-soft: #eef4ff;
  --border: #dce4ef;
  --border-soft: #e8edf5;
  --border-strong: #d9e2ee;
  --accent: #3268ce;
  --accent-strong: #295bb9;
  --accent-ink: #1d58bc;
  --accent-map: #244fb3;
  --danger: #a63146;
  --danger-surface: #fff5f6;
  --danger-border: #f1d7dc;
  --mode: #204b93;
  --overlay-white: #fffffff2;
  --overlay-label: #ffffffe8;
  --shadow-panel: #172e4811;
  --shadow-control: #172e4822;
  --shadow-marker: #1e385d33;
  --shadow-landmark: #172e4844;
  --focus-wash: #3e75d91c;
  --accent-wash: #244fb333;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-md: 13px;
  --text-lg: 16px;
  --weight-medium: 620;
  --weight-semibold: 700;
  --weight-bold: 750;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-dialog: 12px;

  --control-compact: 32px;
  --control-default: 36px;
  --control-touch: 40px;
  --sidebar-width: 380px;
  --sidebar-mobile-gap: 48px;
  --edge-gap: 8px;
  --edge-tab-size: 40px;
  --edge-top: 16px;
  --motion-fast: 140ms;
  --motion-panel: 220ms;
  --ease-standard: cubic-bezier(.2, .7, .2, 1);
  --layer-map-ui: 450;
  --layer-sidebar: 600;
  --layer-edge: 650;
  --layer-menu: 700;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font-family: var(--font-ui); color: var(--ink); background: var(--surface-canvas); font-synthesis: none; }
button, input, select { font: inherit; }
button { cursor: pointer; }
svg { display: block; }
[hidden], .hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

.app {
  position: relative;
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  height: 100dvh;
  overflow: hidden;
  transition: grid-template-columns var(--motion-panel) var(--ease-standard);
}

.app.settings-closed { grid-template-columns: 0 minmax(0, 1fr); }

.side {
  z-index: var(--layer-sidebar);
  width: var(--sidebar-width);
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  overflow: hidden;
  background: var(--surface-panel);
  box-shadow: 2px 0 18px var(--shadow-panel);
  transform: translateX(0);
  transition: transform var(--motion-panel) var(--ease-standard);
}

.app.settings-closed .side { transform: translateX(-100%); }

.sidebar-header {
  min-width: 0;
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--border-soft);
}

.sidebar-header h1 {
  margin: 0 0 var(--space-1);
  color: var(--ink-strong);
  font-size: var(--text-lg);
  line-height: 1.25;
  letter-spacing: -.3px;
}

.title-row {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--control-compact);
  gap: var(--space-2);
  align-items: center;
}

.card-title-text {
  min-width: 0;
  overflow: hidden;
  color: var(--ink-strong);
  font-size: var(--text-lg);
  font-weight: var(--weight-bold);
  line-height: 1.25;
  letter-spacing: -.3px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#cardTitle:not([hidden]) { grid-column: 1; }

.scroll {
  min-height: 0;
  padding: var(--space-3);
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

.sidebar-footer {
  padding: var(--space-3);
  border-top: 1px solid var(--border-soft);
  background: var(--surface-subtle);
}

.list-heading,
.heading-label,
.heading-actions,
.section-heading,
.section-actions,
.dialog-header,
.dialog-actions {
  display: flex;
  align-items: center;
}

.list-heading {
  min-height: var(--control-compact);
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

.heading-label { min-width: 0; gap: var(--space-2); font-size: var(--text-md); font-weight: var(--weight-bold); }
.heading-actions, .section-actions { flex: 0 0 auto; gap: var(--space-1); }

.chip {
  min-width: var(--space-5);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--surface-accent-soft);
  color: var(--accent-ink);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  line-height: 1;
  text-align: center;
}

.empty-state {
  margin: 0 0 var(--space-3);
  padding: var(--space-5) var(--space-4);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  color: var(--ink-soft);
  font-size: var(--text-sm);
  line-height: 1.5;
  text-align: center;
}

.point-list,
.zone-list,
.landmark-list {
  display: grid;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}

.point-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface-panel);
}

.point-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.point-head {
  display: flex;
  gap: 0;
  align-items: center;
  min-height: var(--control-compact);
  padding: 0 var(--space-1);
  background: var(--surface-control);
}

.point-card.selected > .point-head { background: var(--surface-selected); }
.point-card.map-hidden .point-name-text { color: var(--ink-soft); }
.point-card.collapsed { cursor: grab; touch-action: none; }
.point-card.reordering { cursor: grabbing; opacity: .65; user-select: none; }

.point-name-text,
.landmark-name {
  min-width: 0;
  overflow: hidden;
  font-size: var(--text-sm);
  font-weight: var(--weight-bold);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.point-title { display: flex; align-items: center; flex: 1; min-width: 0; }
.point-title .point-name-text { flex: 0 1 auto; }
.point-head > .icon-btn, .point-title > .icon-btn { flex: 0 0 auto; }
.point-head input.point-name {
  flex: 1;
  width: 0;
  height: var(--control-compact);
  padding: 0 var(--space-1);
  border: 0;
  border-bottom: 1px solid var(--accent);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}
.name-confirm { display: none; }
.editing-name .name-pencil { display: none; }
.editing-name .name-confirm { display: block; }

.point-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }

.point-body { padding: var(--space-2); }

.section {
  margin-bottom: var(--space-2);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border-soft);
}

.section-heading {
  min-height: var(--control-compact);
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
}

.section-heading strong { min-width: 0; font-size: var(--text-sm); }
.coordinate-section .section-heading { margin-bottom: 0; }
.section > .cols2:last-child { margin-bottom: 0; }

.coordinate-text {
  min-width: 0;
  max-width: 68%;
  padding: var(--space-1) var(--space-2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--accent-ink);
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.coordinate-text:hover { background: var(--surface-hover); }

.field {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.cols2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

label {
  color: var(--ink-muted);
  font-size: var(--text-xs);
  font-weight: var(--weight-medium);
}

input[type="number"],
input[type="text"],
select {
  width: 100%;
  min-width: 0;
  height: var(--control-compact);
  padding: 0 var(--space-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  outline: none;
  background: var(--surface-panel);
  color: var(--ink);
  font-size: var(--text-sm);
}

input:focus,
select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--focus-wash);
}

input[type="color"] {
  width: 100%;
  height: var(--control-default);
  padding: var(--space-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-panel);
  cursor: pointer;
}

input[type="range"] { width: 100%; accent-color: var(--accent); }

.input-unit { position: relative; min-width: 0; }
.input-unit input { padding-right: var(--space-6); font-variant-numeric: tabular-nums; }
.unit { position: absolute; top: 50%; right: var(--space-2); color: var(--ink-soft); font-size: var(--text-xs); pointer-events: none; transform: translateY(-50%); }

.btn {
  width: 100%;
  min-height: var(--control-default);
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-control);
  color: var(--ink);
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  transition: background-color var(--motion-fast) ease, border-color var(--motion-fast) ease, color var(--motion-fast) ease, transform var(--motion-fast) ease;
}

.btn:hover { background: var(--surface-hover); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { border-color: var(--accent); background: var(--accent); color: var(--surface-panel); }
.btn-primary:hover { border-color: var(--accent-strong); background: var(--accent-strong); }
.btn-danger { border-color: var(--danger-border); background: var(--danger-surface); color: var(--danger); }
.btn-compact { width: auto; min-height: var(--control-compact); padding: var(--space-1) var(--space-2); }
.delete-point { margin-top: var(--space-1); }

.icon-btn {
  width: var(--control-compact);
  height: var(--control-compact);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-muted);
  transition: background-color var(--motion-fast) ease, color var(--motion-fast) ease, transform var(--motion-fast) ease;
}

.icon-btn:hover { background: var(--surface-hover); color: var(--accent-ink); }
.icon-btn:active { transform: translateY(1px); }
.icon-btn svg { width: 17px; height: 17px; pointer-events: none; }
.settings-gear svg { width: 16px; height: 16px; }
.danger-icon { color: var(--danger); }

button:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.no-zones {
  margin: 0;
  padding: var(--space-1);
  color: var(--ink-soft);
  font-size: var(--text-xs);
  text-align: center;
}

.zone-card {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr)) var(--control-compact) var(--control-compact);
  gap: var(--space-1);
  align-items: center;
  padding: var(--space-1);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--surface-subtle);
}

.landmark-item {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--control-compact) var(--control-compact);
  gap: var(--space-1);
  align-items: center;
  min-height: calc(var(--control-compact) + var(--space-2));
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  background: var(--surface-subtle);
}

.edge-tab {
  position: absolute;
  top: var(--edge-top);
  left: 0;
  z-index: var(--layer-edge);
  width: var(--edge-tab-size);
  height: var(--edge-tab-size);
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-panel);
  color: var(--ink-muted);
  box-shadow: 0 2px 10px var(--shadow-control);
  transform: translateX(calc(var(--sidebar-width) + var(--edge-gap)));
  transition: background-color var(--motion-fast) ease, color var(--motion-fast) ease, transform var(--motion-panel) var(--ease-standard);
}

.edge-tab:hover { background: var(--surface-hover); color: var(--accent-ink); }
.edge-tab svg { width: 19px; height: 19px; }
.save-toggle { transform: translateX(calc(var(--sidebar-width) + var(--edge-gap) + var(--edge-tab-size) + var(--space-1))); }
.app.settings-closed .settings-toggle { transform: translateX(0); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
.app.settings-closed .save-toggle { transform: translateX(calc(var(--edge-tab-size) + var(--space-1))); }
.app.settings-closed .settings-toggle svg { transform: rotate(180deg); }

.save-menu {
  position: absolute;
  top: calc(var(--edge-top) + var(--edge-tab-size) + var(--space-2));
  left: 0;
  z-index: var(--layer-menu);
  width: 196px;
  display: grid;
  gap: var(--space-1);
  padding: var(--space-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface-panel);
  box-shadow: 0 8px 24px var(--shadow-control);
  transform: translateX(calc(var(--sidebar-width) + var(--edge-gap) + var(--edge-tab-size) + var(--space-1)));
  transition: transform var(--motion-panel) var(--ease-standard), opacity var(--motion-fast) ease;
}

.app.settings-closed .save-menu { transform: translateX(calc(var(--edge-tab-size) + var(--space-1))); }
.save-menu .btn { justify-content: flex-start; }

.map-wrap { position: relative; z-index: 0; min-width: 0; min-height: 0; overflow: hidden; }
#map { width: 100%; height: 100%; background: var(--surface-canvas); }
.map-header { position: absolute; top: var(--space-4); right: 60px; left: 104px; z-index: var(--layer-map-ui); pointer-events: none; }
.badge-mode { width: max-content; max-width: 100%; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--mode); color: var(--surface-panel); box-shadow: 0 4px 16px var(--shadow-control); font-size: var(--text-sm); font-weight: var(--weight-medium); }

.distance-label {
  width: max-content;
  padding: 2px var(--space-1);
  border: 1px solid var(--surface-panel);
  border-radius: 5px;
  background: var(--overlay-label);
  box-shadow: 0 1px 3px var(--shadow-control);
  color: var(--mode);
  font-weight: var(--weight-bold);
  text-align: center;
  white-space: nowrap;
  transform: translate(-50%, -50%);
}

.leaflet-div-icon { border: 0; background: transparent; }
.center-dot { width: var(--space-4); height: var(--space-4); border: 4px solid var(--accent-map); border-radius: 50%; background: var(--surface-panel); box-shadow: 0 0 0 3px var(--accent-wash), 0 2px 8px var(--shadow-marker); }
.center-dot.selected { border-color: var(--surface-panel); background: var(--accent-map); box-shadow: 0 0 0 3px var(--accent-map); }
.landmark-dot { position: absolute; top: -5px; left: -5px; width: 10px; height: 10px; border: 2px solid var(--surface-panel); background: var(--mode); box-shadow: 0 1px 4px var(--shadow-landmark); transform: rotate(45deg); }
.landmark-caption { position: absolute; top: -14px; left: var(--space-3); width: max-content; max-width: 200px; padding: var(--space-1) var(--space-2); overflow-wrap: anywhere; border: 1px solid var(--border); border-radius: 5px; background: var(--overlay-white); box-shadow: 0 1px 4px var(--shadow-control); color: var(--ink); }
.landmark-caption strong { display: block; font-size: var(--text-sm); }
.landmark-caption small { display: block; margin-top: 2px; color: var(--ink-muted); font-size: var(--text-xs); white-space: nowrap; }

dialog {
  width: min(760px, calc(100vw - var(--space-8)));
  max-height: calc(100dvh - var(--space-8));
  padding: 0;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-dialog);
  background: var(--surface-panel);
  color: var(--ink);
  box-shadow: 0 18px 48px var(--shadow-landmark);
}

dialog::backdrop { background: var(--shadow-landmark); }
#settingsForm { padding: var(--space-4); }
.dialog-header { justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
.dialog-header h2 { margin: 0; color: var(--ink-strong); font-size: var(--text-lg); line-height: 1.25; }
#settingsScope { margin: var(--space-1) 0 0; color: var(--ink-soft); font-size: var(--text-sm); }
#settingsFields { display: grid; gap: var(--space-3); }
.settings-category { min-width: 0; padding: var(--space-3); border: 1px solid var(--border-soft); border-radius: var(--radius-md); background: var(--surface-subtle); }
.settings-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.settings-subgroup { min-width: 0; display: grid; align-content: start; gap: var(--space-2); }
.settings-subgroup h4 { margin: 0; font-size: var(--text-xs); color: var(--ink-soft); font-weight: var(--weight-medium); }
.settings-note { margin: 0; color: var(--ink-soft); font-size: var(--text-xs); line-height: 1.5; }
#settingsFields .field { display: grid; grid-template-columns: minmax(0, 1fr) 96px; align-items: center; gap: var(--space-2); }
#settingsFields input[type="color"] { width: 48px; height: var(--control-compact); justify-self: end; }
#settingsFields input[readonly] { background: var(--surface-control); color: var(--ink-soft); }
#settingsFields .settings-name { grid-template-columns: 1fr; }
.settings-group-title {
  margin: 0 0 var(--space-3);
  color: var(--ink-strong);
  font-size: var(--text-sm);
  line-height: 1.35;
}
.dialog-actions { justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-5); }
.dialog-actions .btn { width: auto; min-width: 104px; }
.settings-popover, .coordinate-popover {
  position: fixed;
  inset: auto;
  margin: 0;
  width: min(360px, calc(100vw - var(--space-4)));
  max-height: calc(100dvh - var(--space-4));
  overflow: auto;
  z-index: calc(var(--layer-menu) + 1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface-panel);
  color: var(--ink);
  box-shadow: 0 8px 24px var(--shadow-control);
}
.settings-popover #settingsForm { padding: var(--space-3); }
.settings-popover .settings-group-title { display: none; }
.settings-popover .settings-columns { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }
.settings-popover .dialog-header { margin-bottom: var(--space-3); }
.settings-popover .dialog-actions { flex-wrap: wrap; margin-top: var(--space-3); }
.settings-popover .dialog-actions .btn { min-width: 0; }
.coordinate-popover { padding: var(--space-3); }
.coordinate-popover h3 { margin: 0; font-size: var(--text-sm); }
.coordinate-popover .btn { width: auto; }

@media (max-width: 760px) {
  :root {
    --sidebar-width: min(356px, calc(100vw - var(--sidebar-mobile-gap)));
    --sidebar-mobile-gap: 96px;
    --control-compact: var(--control-touch);
    --edge-top: 12px;
  }

  .app,
  .app.settings-closed { display: block; }
  .map-wrap { position: absolute; inset: 0; }
  .side { position: absolute; inset: 0 auto 0 0; height: 100dvh; }
  .sidebar-header, .scroll, .sidebar-footer { padding-right: var(--space-3); padding-left: var(--space-3); }
  .icon-btn { width: var(--control-touch); height: var(--control-touch); }
  .btn-compact { min-height: var(--control-touch); }
  .zone-card { grid-template-columns: repeat(2, minmax(0, 1fr)) var(--control-touch) var(--control-touch); }
  .landmark-item { grid-template-columns: minmax(0, 1fr) var(--control-touch) var(--control-touch); }
  .save-menu,
  .app.settings-closed .save-menu { right: var(--space-2); left: auto; transform: none; }
  .leaflet-top.leaflet-right { top: calc(var(--edge-top) + var(--edge-tab-size) + var(--space-2)); }
  .map-header { top: var(--space-3); right: 56px; left: 96px; }
  .badge-mode { font-size: var(--text-xs); }
}

@media (max-width: 420px) {
  .point-head .icon-btn { width: 36px; height: 36px; }
  .section-actions { gap: 0; }
  .section-actions .icon-btn { width: 36px; height: 36px; }
  .btn-compact { min-height: 36px; }
  .zone-card { grid-template-columns: repeat(2, minmax(0, 1fr)) 36px 36px; }
  .zone-card .icon-btn { width: 36px; height: 36px; }
}

@media (max-width: 600px) {
  .settings-columns { grid-template-columns: minmax(0, 1fr); gap: var(--space-3); }

}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

@page { size: A4 landscape; margin: 8mm; }

@media print {
  html, body, .app { height: 100%; min-height: 0; margin: 0; padding: 0; background: var(--surface-panel); }
  .app { display: block; }
  .side, .badge-mode, .leaflet-control-zoom, .edge-tab, .save-menu, dialog, [popover] { display: none !important; }
  .map-wrap { position: relative; inset: auto; width: 100%; height: 100%; }
  .map-header { top: var(--space-2); right: auto; left: var(--space-2); padding-right: 0; }
  #map { width: 100%; height: 100%; }
  .leaflet-control-attribution { font-size: 8px !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

<body>

      finishReorder(true);
      setMode('center');
      globalSettings=nextGlobal;points=importedPoints;pointId=points.length+1;zoneId=nextZoneId;landmarkId=nextLandmarkId;
      $('pointList').replaceChildren();points.forEach(appendPointEditor);
      $('emptyPoints').hidden=points.length>0;$('pointCount').textContent=points.length;
      updateVisibilityButton();
      selectPoint((Number.isInteger(data.selectedPoint)?points[data.selectedPoint]:null)||points[0]||null,false);
      if(data.view && validCoords(data.view.lat,data.view.lng) && Number.isFinite(data.view.zoom))map.setView([data.view.lat,data.view.lng],clamp(data.view.zoom,1,19),{animate:false});else fitMap();
    } catch(err){ alert('Не вдалося відкрити проєкт: '+err.message); }
    e.target.value='';
  };
  map.getContainer().style.cursor='crosshair';
  selectPoint(null);
  updateVisibilityButton();
  new ResizeObserver(()=>map.invalidateSize({animate:false})).observe($('map'));
})();
</script>
</body>
</html>
